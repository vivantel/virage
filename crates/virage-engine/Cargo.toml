[package]
name        = "virage-engine"
version     = "2.1.0"
edition     = "2021"
description = "Virage CE Rust monolith — chunkers, embedders, pipeline (ADR-051)"
license     = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "virage"
path = "src/bin/virage.rs"
required-features = ["cli-binary"]

[features]
default     = ["chunker-all", "embedder-onnx", "wasm-host"]
chunker-all = ["chunker-md", "chunker-pdf", "chunker-docx", "chunker-latex", "chunker-lang"]
chunker-md  = ["dep:comrak"]
chunker-pdf = ["dep:lopdf"]
chunker-docx   = ["dep:docx-rs"]
chunker-latex  = []
chunker-lang   = [
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-java",
    "dep:tree-sitter-go",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-ruby",
]
embedder-onnx = ["dep:ort", "dep:tokenizers", "dep:ureq", "ort/load-dynamic", "ort/std", "ort/api-24"]
# Phase 2 — source providers
source-all    = ["source-git", "source-localfs"]
source-git    = ["dep:git2", "dep:tokio", "dep:async-trait", "dep:futures", "dep:bytes", "dep:anyhow", "dep:globset"]
source-localfs = ["dep:walkdir", "dep:tokio", "dep:async-trait", "dep:futures", "dep:bytes", "dep:anyhow", "dep:sha2", "dep:globset"]
# Phase 3 — vector store adapters
store-all      = ["store-lancedb", "store-qdrant", "store-postgres", "store-chromadb", "db-sqlite"]
store-lancedb  = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:tokio", "dep:async-trait", "dep:anyhow", "dep:futures"]
store-qdrant   = ["dep:qdrant-client", "dep:tokio", "dep:async-trait", "dep:anyhow"]
store-postgres = ["dep:sqlx", "dep:tokio", "dep:async-trait", "dep:anyhow"]
store-chromadb = ["dep:reqwest", "dep:tokio", "dep:async-trait", "dep:anyhow", "dep:serde"]
# VectorStore backed by a loaded dylib plugin instead of a statically-linked backend. Local-dev/
# CI-iteration alternative to store-lancedb; does not touch the publish-gate combination.
store-dylib    = ["dylib-plugins", "dep:tokio", "dep:async-trait", "dep:anyhow", "dep:serde"]
# Embedder backed by a loaded dylib plugin instead of statically-linked ORT (IR-050 Phase 3/4).
# Alternative to embedder-onnx/download-binaries — no ort_sys/tokenizers dependency chain.
embedder-dylib = ["dylib-plugins", "dep:serde"]
# Phase 3 — SQLite state store
db-sqlite = ["dep:rusqlite"]
# Phase 4 — pipeline
source-types  = ["dep:async-trait", "dep:futures", "dep:bytes", "dep:anyhow", "dep:globset"]
store-types   = ["dep:async-trait", "dep:anyhow"]
chunker-walk  = ["dep:sha2"]
# ADR-057 — RamSampling ConcurrencyStrategy's free-memory sampling. `system` only: no
# disk/network/user/component polling, which this pipeline never needs.
pipeline      = ["chunker-walk", "source-types", "store-types", "db-sqlite",
                 "dep:tokio", "dep:async-trait", "dep:anyhow", "dep:futures", "dep:bytes",
                 "dep:tracing", "dep:sysinfo"]
# Phase 5 — CLI binary
# dep:anyhow: history/ (gated on this feature alone, lib.rs) needs it. Pre-existing gap that only
# surfaced when virage-plugin-ort became the first consumer to request "config" without something
# else (pipeline, cli-binary) also pulling anyhow in as a side effect.
config = ["dep:serde", "dep:anyhow"]
# IR-038 Step 5 — `virage eval run/compare` against RAGBench. RAGBench subset queries are
# fetched from HuggingFace's Datasets Server rows API (plain JSON), not the raw per-subset
# Parquet files in the dataset repo — see docs/decisions/IR-038-eval-quality-bench-redesign.md's
# 2026-07-30 correction. Reuses reqwest (already vendored for store-chromadb) + sha2 (already
# vendored for chunker-walk) — no new Cargo dependency.
eval-ragbench = ["dep:reqwest", "dep:tokio", "dep:anyhow", "dep:sha2"]
# cli-binary: everything the binary needs except embedder-onnx (no ort/load-dynamic).
# Used by publish CI: --features cli-binary,download-binaries --no-default-features
cli-binary = [
    "pipeline", "source-all", "chunker-all",
    "store-lancedb", "store-qdrant", "store-postgres", "store-chromadb", "db-sqlite",
    "config", "eval-ragbench",
    "dep:clap", "dep:indicatif", "dep:inquire", "dep:console", "dep:flate2", "dep:tar",
    "dep:ureq",
    "dep:clap_complete", "dep:dirs", "dep:notify-debouncer-mini",
    "dep:tracing", "dep:tracing-subscriber",
]
# cli: local dev — same as cli-binary but also pulls in embedder-onnx (ort/load-dynamic).
cli = ["cli-binary", "embedder-onnx"]
# cli-binary-dylib / cli-dylib: same as cli-binary/cli, but store-dylib instead of store-lancedb —
# no lancedb/arrow/datafusion dependency chain, for local dev iteration that doesn't need lancedb
# statically linked. store-lancedb can't just be omitted from cli-binary's own list and re-added
# selectively: Cargo features don't support "minus a sub-feature", so this duplicates cli-binary's
# list with store-dylib substituted in place of store-lancedb.
cli-binary-dylib = [
    "pipeline", "source-all", "chunker-all",
    "store-dylib", "store-qdrant", "store-postgres", "store-chromadb", "db-sqlite",
    "config", "eval-ragbench",
    "dep:clap", "dep:indicatif", "dep:inquire", "dep:console", "dep:flate2", "dep:tar",
    "dep:ureq",
    "dep:clap_complete", "dep:dirs", "dep:notify-debouncer-mini",
    "dep:tracing", "dep:tracing-subscriber",
]
cli-dylib = ["cli-binary-dylib", "embedder-onnx"]
# cli-binary-full-dylib: cli-binary-dylib (store-dylib) + embedder-dylib in place of
# download-binaries -- the actual "no static third-party dependency" combination IR-050 Phase 4
# targets for a fully dynamically-linked published binary. Distinct from cli-binary-dylib alone (which only drops the
# lancedb chain): dropping ort/download-binaries too means swapping the embedder path as well, not
# just the store path, since they're independent Cargo features gating independent dependency
# chains.
cli-binary-full-dylib = [
    "pipeline", "source-all", "chunker-all",
    "store-dylib", "store-qdrant", "store-postgres", "store-chromadb", "db-sqlite",
    "embedder-dylib",
    "config", "eval-ragbench",
    "dep:clap", "dep:indicatif", "dep:inquire", "dep:console", "dep:flate2", "dep:tar",
    "dep:ureq",
    "dep:clap_complete", "dep:dirs", "dep:notify-debouncer-mini",
    "dep:tracing", "dep:tracing-subscriber",
]
# Phase 6 — production binary builds: bundle ORT instead of loading dynamically.
# Publish CI builds with --features cli-binary,download-binaries --no-default-features.
# ort/load-dynamic is intentionally absent so the statically-linked ORT path is used.
download-binaries = ["dep:ort", "dep:tokenizers", "dep:ureq", "ort/download-binaries", "ort/std", "ort/tls-rustls"]
# Phase 7 — WASM Component Model plugin host
wasm-host = [
    "dep:wasmtime", "dep:wasmtime-wasi",
    "dep:anyhow",
]
# cdylib plugin host (chunker/store/embedder vtables) — lives here so any downstream consumer
# loading a given plugin .so agrees on one canonical vtable shape rather than maintaining its own
# copy. Hand-checked version symbol + libloading is the real ABI mechanism; no abi_stable needed.
dylib-plugins = ["dep:libloading", "dep:anyhow"]

[dependencies]
virage-vidoc = { workspace = true }
indexmap     = { workspace = true }
serde_json   = { workspace = true }

# Chunker deps — optional, enabled via feature flags
comrak  = { version = "0.52", optional = true }
lopdf   = { version = "0.41", default-features = false, optional = true }
docx-rs = { version = "0.4",  default-features = false, optional = true }

tree-sitter            = { version = "0.23", optional = true }
tree-sitter-python     = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-java       = { version = "0.23", optional = true }
tree-sitter-go         = { version = "0.23", optional = true }
tree-sitter-rust       = { version = "0.23", optional = true }
tree-sitter-c          = { version = "0.23", optional = true }
tree-sitter-cpp        = { version = "0.23", optional = true }
tree-sitter-c-sharp    = { version = "0.23", optional = true }
tree-sitter-ruby       = { version = "0.23", optional = true }

# Pipeline deps — optional, enabled via the `pipeline` feature
sysinfo    = { version = "0.39", default-features = false, features = ["system"], optional = true }

# Embedder deps — optional, enabled via feature flags
ort        = { version = "2.0.0-rc.12", default-features = false, optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
ureq       = { version = "2",   features = ["tls"], optional = true }

# Source provider deps — optional, enabled via feature flags
git2        = { version = "0.21", features = ["vendored-libgit2"], optional = true }
walkdir     = { version = "2",    optional = true }
tokio       = { version = "1",    features = ["fs", "rt", "rt-multi-thread", "macros", "sync", "time"], optional = true }
async-trait = { version = "0.1",  optional = true }
futures     = { version = "0.3",  optional = true }
bytes       = { version = "1",    optional = true }
anyhow      = { version = "1",    optional = true }
sha2        = { version = "0.10", optional = true }
globset     = { version = "0.4",  optional = true }
libloading  = { version = "0.8",  optional = true }

# Store adapter deps — optional, enabled via feature flags
lancedb      = { version = "0.31",  optional = true }
arrow-array  = { version = "58",    optional = true }
arrow-schema = { version = "58",    optional = true }
qdrant-client = { version = "1.18", optional = true }
sqlx         = { version = "0.9",   default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"], optional = true }
reqwest      = { version = "0.12",  default-features = false, features = ["json", "rustls-tls"], optional = true }
serde        = { workspace = true, optional = true }
# SQLite state store
rusqlite     = { version = "0.40",  features = ["bundled"], optional = true }
# CLI binary
clap         = { version = "4",    features = ["derive"], optional = true }
indicatif    = { version = "0.17", optional = true }
inquire      = { version = "0.9",  optional = true }
console      = { version = "0.15", optional = true }
flate2                = { version = "1",   optional = true }
tar                   = { version = "0.4", optional = true }
clap_complete         = { version = "4",   optional = true }
dirs                  = { version = "6",   optional = true }
notify-debouncer-mini = { version = "0.6", optional = true }
tracing              = { version = "0.1", optional = true }
tracing-subscriber   = { version = "0.3", features = ["fmt", "json", "env-filter"], optional = true }
# WASM plugin host
wasmtime     = { version = "46", default-features = false, features = ["cranelift", "component-model", "std", "runtime", "threads", "anyhow"], optional = true }
wasmtime-wasi = { version = "46", optional = true }

[build-dependencies]
cc = "1"

# Used by tests/integration_chunkers.rs to construct real PDF/DOCX bytes
# in-memory (mirrors the optional prod deps above; same version/feature set
# so cargo unifies rather than resolving a second copy).
[dev-dependencies]
lopdf   = { version = "0.41", default-features = false }
docx-rs = { version = "0.4",  default-features = false }
# ADR-057 worker-gating test needs paused/advanceable time (tokio::time::advance) to exercise
# CONCURRENCY_SAMPLE_INTERVAL without a real multi-second sleep. Same tokio version as the prod
# dep above so cargo unifies to one copy with the union of features.
tokio    = { version = "1", features = ["test-util"] }
