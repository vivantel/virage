name: RAG Quality & Efficiency Eval

on:
  workflow_dispatch:

jobs:
  static-evals:
    name: Skill Routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skill routing accuracy
        run: npx tsx eval/scripts/skill-routing.mts

      - name: Write job summary
        if: always()
        run: |
          echo "## Skill Routing Accuracy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npx tsx eval/scripts/skill-routing.mts --summary >> $GITHUB_STEP_SUMMARY || true

  rag-quality:
    name: RAG Pipeline Quality & Token Efficiency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies (for tsx)
        run: npm ci

      - uses: ./.github/actions/virage-index
        with:
          cache-key: rag-eval-${{ github.ref_name }}-${{ github.sha }}
          cache-restore-keys: |
            rag-eval-${{ github.ref_name }}-
            rag-eval-

      - name: DEBUG node execSync vs shell
        run: |
          echo "shell which virage:"; which virage
          echo "shell PATH: $PATH"
          node -e '
            const { execSync } = require("child_process");
            console.log("node process.env.PATH:", process.env.PATH);
            try {
              const out = execSync("which virage", { encoding: "utf-8" });
              console.log("node which virage:", out);
            } catch (e) { console.log("node which virage FAILED:", e.message); }
            try {
              const out = execSync("virage query test --top-k 1 --json --config virage.config.ci.json", { encoding: "utf-8", stdio: ["pipe","pipe","pipe"], cwd: process.cwd() });
              console.log("node execSync query SUCCESS, length:", out.length);
            } catch (e) {
              console.log("node execSync query FAILED. stderr:", e.stderr);
            }
          '

      - name: Token efficiency (with vs without MCP)
        run: npx tsx eval/scripts/token-efficiency.mts

      - name: Pipeline quality assessment
        id: quality_run
        run: virage quality run --ci --config virage.config.ci.json

      - name: Write job summary
        if: always()
        run: |
          echo "## Token Efficiency: With vs Without Virage MCP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npx tsx eval/scripts/token-efficiency.mts --summary >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Quality" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          virage --format markdown quality run --config virage.config.ci.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
