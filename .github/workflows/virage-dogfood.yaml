name: Virage Dogfooding QA

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: virage-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogfood-qa:
    name: Virage Dogfooding QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build:all

      - name: Install Virage CLI
        run: npm install -g @vivantel/virage@latest

      - name: Run Virage quality check
        run: virage quality --fail-fast --config virage.config.json

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virage-quality-report
          path: |
            .virage/quality-history/
            .virage/eval-history/

  dogfood-index:
    name: Virage Index Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Virage CLI
        run: npm install -g @vivantel/virage@latest

      - name: Restore Virage cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .virage/lancedb
            .virage/model-cache
          key: virage-${{ github.ref_name }}-${{ hashFiles('crates/virage-engine/src/stores/*.rs') }}-${{ github.sha }}
          restore-keys: |
            virage-${{ github.ref_name }}-${{ hashFiles('crates/virage-engine/src/stores/*.rs') }}-

      - name: Run Virage index
        run: virage -v index --config virage.config.json
        working-directory: .

      - name: Save Virage cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .virage/lancedb
            .virage/model-cache
          key: virage-${{ github.ref_name }}-${{ hashFiles('crates/virage-engine/src/stores/*.rs') }}-${{ github.sha }}