name: Quality Self-Assessment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  quality:
    name: Pipeline Quality Assessment
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/virage-index
        with:
          cache-key: quality-self-assessment-${{ github.ref_name }}-${{ github.sha }}
          cache-restore-keys: |
            quality-self-assessment-${{ github.ref_name }}-
            quality-self-assessment-

      - name: Run quality self-assessment
        run: virage --format json quality run --ci --config virage.config.ci.json > .virage/quality-report.json
        continue-on-error: true
        id: quality_run

      - name: Upload quality report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-report
          path: .virage/quality-report.json
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## Pipeline Quality Self-Assessment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .virage/quality-report.json ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            virage --format markdown quality run --config virage.config.ci.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || \
            echo "> Quality report generated — see artifact for details." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ Quality report not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Store benchmark data
        uses: benchmark-action/github-action-benchmark@v1
        if: always() && hashFiles('.virage/history/benchmark-data.json') != ''
        with:
          name: Virage Quality Metrics
          tool: customBiggerIsBetter
          output-file-path: .virage/history/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: "85%"
          comment-on-alert: false
          fail-on-alert: false

      - name: Publish quality badge to gh-pages
        if: always() && hashFiles('.virage/history/quality/badge.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BADGE_JSON=$(cat .virage/history/quality/badge.json)

          git fetch origin gh-pages
          git checkout gh-pages

          mkdir -p badges
          echo "$BADGE_JSON" > badges/quality.json

          git add badges/quality.json
          if git diff --cached --quiet; then
            echo "Badge unchanged — skipping commit."
          else
            git commit -m "chore(badges): update quality badge [skip ci]"
            git push origin gh-pages
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if quality gates did not pass
        if: steps.quality_run.outcome == 'failure'
        run: |
          echo "Quality self-assessment failed — see report above."
          exit 1
