name: "Manual Publish: CE TS Packages"

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Space-separated CE package paths to publish
          (e.g. "packages/virage-chunker-ce-ast packages/virage-chunker-ce-ts").
          Leave blank to publish all packages in .release-please-manifest.json.
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Patch lockfile stub version fields
        run: node scripts/patch-lockfile-stubs.cjs

      - run: npm ci --omit=optional

      - name: Resolve packages to publish
        id: resolve
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            PKGS="${{ inputs.packages }}"
          else
            PKGS=$(jq -r 'keys[]' .release-please-manifest.json | tr '\n' ' ')
          fi
          echo "pkgs=$PKGS" >> "$GITHUB_OUTPUT"

      - name: Build TypeScript packages
        run: |
          # Foundational packages other CE packages depend on as workspace links —
          # build these first regardless of what's being published, matching
          # build:all's own established order (root package.json).
          npm run build --workspace packages/virage-core --if-present
          npm run build --workspace packages/virage-agent-core --if-present
          for pkg in ${{ steps.resolve.outputs.pkgs }}; do
            echo "Building $pkg …"
            npm run build --workspace "$pkg" --if-present
          done

      - name: Publish packages
        run: |
          for pkg in ${{ steps.resolve.outputs.pkgs }}; do
            echo "Publishing $pkg …"
            npm publish --workspace "$pkg" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
