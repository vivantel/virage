name: "Manual Publish: CE TS Packages"

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Space-separated CE package paths to publish
          (e.g. "packages/virage-chunker-ce-ast packages/virage-chunker-ce-ts").
          Leave blank to publish all packages in .release-please-manifest.json.
        required: false
        default: ''
      github_packages_core:
        description: >
          Publish only packages/virage-core at its current version to GitHub Packages
          (backfill for a version that was published to npm by hand); skips the npm publish.
        type: boolean
        required: false
        default: false

# onnxruntime-node downloads a CUDA binary from a GitHub release on install; the
# v1.21.0 release is gone (404), which fails every plain `npm ci`. CI never uses CUDA.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  publish:
    if: ${{ !inputs.github_packages_core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Patch lockfile stub version fields
        run: node scripts/patch-lockfile-stubs.cjs

      - run: npm ci

      - name: Build TypeScript packages
        run: npm run build:all

      - name: Resolve packages to publish
        id: resolve
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            PKGS="${{ inputs.packages }}"
          else
            PKGS=$(jq -r 'keys[]' .release-please-manifest.json | tr '\n' ' ')
          fi
          echo "pkgs=$PKGS" >> "$GITHUB_OUTPUT"

      - name: Publish packages
        run: |
          for pkg in ${{ steps.resolve.outputs.pkgs }}; do
            echo "Publishing $pkg …"
            npm publish --workspace "$pkg" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-core-github-packages:
    name: Publish @vivantel/virage-core to GitHub Packages
    if: ${{ inputs.github_packages_core }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Patch lockfile stub version fields
        run: node scripts/patch-lockfile-stubs.cjs

      - run: npm ci

      - run: npm run build --workspace packages/virage-core

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: packages/virage-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
