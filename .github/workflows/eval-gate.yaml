name: Eval Gate

on:
  pull_request:
    branches: [master]
    paths:
      - 'crates/virage-engine/**'
      - 'docs/**'
      - 'virage.config.ci.json'
      - '.github/workflows/eval-gate.yaml'
      - '.github/actions/virage-index/**'
  workflow_dispatch:

jobs:
  quality-gate:
    name: Pipeline Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/virage-index
        with:
          cache-key: eval-gate-${{ github.base_ref }}-${{ github.sha }}
          cache-restore-keys: |
            eval-gate-${{ github.base_ref }}-
            eval-gate-

      - name: Pipeline quality gate
        id: quality_run
        run: virage quality run --ci

      - name: Write job summary
        if: always()
        run: |
          echo "## Pipeline Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          virage --format markdown quality run >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
