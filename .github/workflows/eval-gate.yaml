name: Eval Gate

on:
  pull_request:
    branches: [master]
    paths:
      - 'crates/virage-engine/**'
      - 'docs/**'
      - 'virage.config.ci.json'
      - '.github/workflows/eval-gate.yaml'
      - '.github/actions/virage-index/**'
  workflow_dispatch:

jobs:
  quality-gate:
    name: Pipeline Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/virage-index
        with:
          cache-key: eval-gate-${{ github.base_ref }}-${{ github.sha }}
          cache-restore-keys: |
            eval-gate-${{ github.base_ref }}-
            eval-gate-

      - name: DEBUG isolate --json / --top-k 5
        run: |
          echo "npm ls -g:"; npm ls -g @vivantel/virage || true
          echo "=== A: top-k 1, no --json ==="
          virage query "configure chunker package include ignore patterns ADR" --top-k 1 --config virage.config.ci.json || true
          echo "=== B: top-k 5, no --json ==="
          virage query "configure chunker package include ignore patterns ADR" --top-k 5 --config virage.config.ci.json || true
          echo "=== C: top-k 1, --json ==="
          virage query "configure chunker package include ignore patterns ADR" --top-k 1 --json --config virage.config.ci.json || true
          echo "=== D: top-k 5, --json (exact script repro) ==="
          virage query "configure chunker package include ignore patterns ADR" --top-k 5 --json --config virage.config.ci.json || true

      - name: Pipeline quality gate
        id: quality_run
        run: virage quality run --ci --config virage.config.ci.json

      - name: Write job summary
        if: always()
        run: |
          echo "## Pipeline Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          virage --format markdown quality run --config virage.config.ci.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
