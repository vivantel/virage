[workspace]
resolver = "2"
members = [
  "crates/*",
]

[workspace.dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
virage-vidoc = { path = "crates/virage-vidoc" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
